<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
    <div class="container">
        <div class="app-logo">
            <div class="logo-circle">+</div>
        </div>
        <h1>{{title}}</h1>
        {% if error %}
        <div class="error">
            {{error}}
        </div>
        {% endif %}
        <form method="post">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" required placeholder="Придумайте логин">
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required placeholder="Придумайте пароль">
            </div>

            <button type="submit" class="btn btn-success">Создать аккаунт</button>
        </form>

        <div class="links">
            <a href="/">← На главную</a>
        </div>
    </div>
</body>
</html>
